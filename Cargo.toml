[package]
name = "compositor"
version = "0.4.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
description = "A layered image editor for Linux, built with QuickGUI"

[dependencies]
cosmic-text = { package = "quickgui-cosmic-text", version = "=0.1.5" }
quickgui = { version = "=0.1.5", default-features = false, features = ["updater"] }
# Enable native Wayland clipboard access in QuickGUI's arboard dependency.
arboard = { version = "=3.6.1", default-features = false, features = ["wayland-data-control"] }
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
wl-clipboard-rs = "=0.9.3"
x11rb = "=0.13.2"
raw-window-handle = "=0.6.2"
winit = { package = "quickgui-winit", version = "=0.1.5", default-features = false, features = ["rwh_06", "wayland", "x11"] }
sctk = { package = "smithay-client-toolkit", version = "=0.19.2", default-features = false, features = ["calloop"] }
wayland-backend = { version = "=0.3.17", features = ["client_system"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "tiff", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
semver = "1"
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl", "vulkan"] }
pollster = "0.4"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "half", "api-27"] }
half = "2"
bytemuck = "1"
url = "2"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
rustix = { version = "1", features = ["fs", "event"] }
libheif-rs = { version = "3", default-features = false, features = ["v1_17", "image"] }
png = "0.18"
lcms2 = "=6.1.1"
zune-core = "0.5.3"
zune-jpeg = "0.5.15"
tiff = "0.11.3"
tiny-skia = { version = "0.11.4", default-features = false, features = ["std", "simd"] }
resvg = { version = "=0.46.0", default-features = false }
i_overlay = "=8.1.2"
ag-psd = "=0.3.0"

rawler = "=0.7.2"
rayon = "1.11"

[build-dependencies]
cc = "1"

[patch.crates-io]
quickgui = { path = "vendor/quickgui" }

[dev-dependencies]
x11-clipboard = "=0.9.3"
quickgui = { version = "=0.1.5", default-features = false, features = ["test-support"] }

[profile.dev]
debug = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
